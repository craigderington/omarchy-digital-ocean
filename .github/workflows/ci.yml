name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: QML JavaScript model tests
        run: node tests/test_model.mjs
      - name: Compile Python sources
        run: python3 -m py_compile digitalocean_backend.py omarchy-digitalocean-fetch
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json >/dev/null
